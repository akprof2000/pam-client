name: CI

# Проверки на каждый push и pull request: сборка, go vet, тесты, gofmt.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # Кэшировать нечего: у проекта нет внешних зависимостей (нет go.sum).
          cache: false

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано (запустите gofmt -w):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Тесты с покрытием
        run: go test -cover ./...

      - name: Фаззинг разбора пути (коротко)
        if: matrix.os == 'ubuntu-latest'
        run: go test ./pam/ -run xxx -fuzz FuzzParsePath -fuzztime 30s

      - name: Гонки данных
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Демонстрационный сценарий
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/demo.sh

      # Сборка для быстрой проверки на тестовом стенде. Хранится один день:
      # это промежуточный результат, а не релиз.
      - name: Пробная сборка бинарников
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath -o build/ ./cmd/...

      - name: Сохранить бинарники как артефакт (1 день)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pam-client-linux-amd64
          path: build/
          retention-days: 1
          if-no-files-found: error
